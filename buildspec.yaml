version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm ci

  build:
    commands:
      - echo Building React Vite app...
      - npm run build

  post_build:
    commands:
      - echo Build completed successfully.

artifacts:
  base-directory: dist
  files:
    - '**/*'
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
